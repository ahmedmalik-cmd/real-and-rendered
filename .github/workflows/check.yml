name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r requirements.txt pyflakes
      - name: Compile + lint
        run: |
          python -m py_compile $(git ls-files '*.py')
          pyflakes $(git ls-files '*.py')
      - name: Privacy check
        run: python tools/privacy_check.py
      - name: Analysis and inspector on the sample memory
        env:
          ROOM_MEMORY_DIR: examples/sample_memory
          MPLBACKEND: Agg
        run: |
          python analysis/visualize.py
          python analysis/document_export.py
          python src/python/memory_inspector.py
          python src/python/memory_inspector.py --visits
