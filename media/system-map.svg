<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -14 1048 368" width="1048" height="368" role="img" aria-label="real &amp; rendered system map: two Kinects into a Unity bridge, a Python perception loop, LLaVA via Ollama, three projectors, TRIBE v2 and CLIP on a GPU machine, and memory on disk">
<style>
  .bg { fill: #0c0b09; }
  .d-box { fill: #111008; stroke: #2e2a23; }
  .d-stage { font-family: 'Space Mono', ui-monospace, Menlo, Consolas, monospace; font-size: 9px; letter-spacing: 2.2px; fill: #ea5fb0; }
  .d-title { font-family: 'Space Grotesk', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 15px; fill: #ddd9d0; }
  .d-sub { font-family: 'Space Mono', ui-monospace, Menlo, Consolas, monospace; font-size: 9.5px; fill: #8f8a80; }
  .d-label { font-family: 'Space Mono', ui-monospace, Menlo, Consolas, monospace; font-size: 9px; fill: #8f8a80; letter-spacing: 0.5px; }
  .d-line { stroke: #ea5fb0; stroke-width: 1; fill: none; opacity: 0.75; }
  .d-dash { stroke: #ea5fb0; stroke-width: 1; fill: none; opacity: 0.55; stroke-dasharray: 3 4; }
  .d-arrow { fill: #ea5fb0; opacity: 0.85; }
</style>
<rect class="bg" x="-24" y="-14" width="1048" height="368" rx="6"/>
                <path class="d-dash" d="M297 86 V46 H903 V79"/><polygon class="d-arrow" points="903,86 899,78 907,78"/>
